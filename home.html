<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elvotric</title>
    <link rel="icon" type="image/png" href="assets/img/logo (2).png">
    <link rel="stylesheet" href="home.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
</head>
<body>
<!-- Header and Navigation -->
<div class="container">  
    <div class="hcontainer">
        <nav class="navbar">
            <img src="assets/img/logo.png" style="width: 100px;">
            <a href="#" class="logo">Power Monitor</a>
            <button class="logout-btn" id="logoutBtn">Logout</button>
        </nav>
    </div>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="navbar-brand">
            <label class="switch">
                <input type="checkbox" id="switch" onchange="toggleSwitch()">
                <span class="slider"></span>
            </label>
        </div>
        <div class="navbar-menu">
            <ul class="nav-links">
                <li class="dropdown">
                    <a href="">RealTime</a>
                    <div class="dropdown-content">
                        <a href="home.html">Device 1</a>
                        <a href="">Device 2</a>
                    </div>
                </li>               
                <li class="dropdown">
                    <a href="">History</a>
                    <div class="dropdown-content">
                        <a href="result.html">Device 1</a>
                        <a href="">Device 2</a>
                    </div>
                </li>                     
                <li class="dropdown">
                    <a href="report.html">Summary</a>
                </li> 
            </ul>
        </div>


    </nav>
</div>

    <!-- Power Monitoring Dashboard -->
    <div class="container">
        <!-- First Row -->
        <div class="row">
            <div class="card energy-card">
                <h2>Apparent Power</h2>
                <div class="energy-value">
                    <span id="apparentPower">0.00</span>
                    <span class="totalEnergy">VA</span>
                </div>

                <h2>Active Power</h2>
                <div class="energy-value">
                    <span id="activePower">0.00</span>
                    <span class="totalEnergy">W</span>
                </div>
            </div>
            <div class="card chart-card">
                <h2>Power Consumption</h2>
                <canvas id="powerChart"></canvas>
            </div>
        </div>

        <!-- Second Row -->
        <div class="row">
            <div class="card gauge-card">
                <h2>Voltage</h2>
                <canvas id="voltageGauge" width="300" height="200"></canvas>
                <div class="gauge-value">
                    <span id="voltageValue">0.0</span>
                    <span class="unit">V</span>
                </div>
            </div>

            <div class="card gauge-card">
                <h2>Current</h2>
                <canvas id="currentGauge" width="300" height="200"></canvas>
                <div class="gauge-value">
                    <span id="currentValue">0.00</span>
                    <span class="unit">A</span>
                </div>
            </div>
            
            <div class="card gauge-card">
                <h2>Power Factor</h2>
                <canvas id="pfGauge" width="300" height="200"></canvas>
                <div class="gauge-value">
                    <span id="pfValue">0</span>
                </div>
            </div>
        </div>

    </div>

    <script src="home.js"></script>
</body>
</html>
